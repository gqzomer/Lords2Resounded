[project]
name = "r2r-upsample"
version = "0.1.0"
requires-python = ">=3.10,<3.11"
dependencies = [
    "audiosr==0.0.7",
    "setuptools>=68,<82",
    "matplotlib<=3.7.5",
    "numpy==1.23.5",
    "torch==2.2.2",
    "torchaudio==2.2.2",
    "torchvision==0.17.2",
]

[tool.poetry.dependencies]
torch = {source = "pytorch-cpu"}
torchaudio = {source = "pytorch-cpu"}
torchvision = {source = "pytorch-cpu"}

[[tool.poetry.source]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
priority = "explicit"

[project.scripts]
r2r-upsample = "r2r_upsample.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"